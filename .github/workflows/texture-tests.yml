name: Texture generator

on:
  push:
    paths:
      - "filamentra/**"
      - "tests/**"
      - ".github/workflows/texture-tests.yml"
  pull_request:
    paths:
      - "filamentra/**"
      - "tests/**"
      - ".github/workflows/texture-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline PNG generator
        run: python -m unittest discover -s tests -v
