name: Texture generator

on:
  push:
    paths:
      - "filamentra/**"
      - "scripts/build_release.py"
      - "tests/**"
      - ".github/workflows/texture-tests.yml"
  pull_request:
    paths:
      - "filamentra/**"
      - "scripts/build_release.py"
      - "tests/**"
      - ".github/workflows/texture-tests.yml"
  workflow_dispatch:

concurrency:
  group: runtime-release-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline PNG generator
        run: python -m unittest discover -s tests -v
      - name: Dry-run release distribution (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py --version 0.0.0
          (cd dist && sha256sum -c Filamentra-0.0.0.zip.sha256)

  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/release_changes.py --self-test
      - name: Detect runtime changes
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/release_changes.py --before "$BEFORE" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  version:
    name: GitVersion 6.8.2
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate numeric version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Publish runtime ZIP
    needs: [unit, version, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: filamentra-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, validate and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          python scripts/release_notes.py --product Filamentra --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          python scripts/build_release.py --version "$VERSION"
          (cd dist && sha256sum -c "Filamentra-$VERSION.zip.sha256")
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo "Version tag already belongs to another commit: $tag" >&2
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" "dist/Filamentra-$VERSION.zip" "dist/Filamentra-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "Filamentra $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
