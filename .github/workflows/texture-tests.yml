name: Texture generator

on:
  push: {} # All pushes: docs-only pushes may recover a previously failed runtime release
  pull_request:
    paths:
      - "filamentra/**"
      - "scripts/build_release.py"
      - "tests/**"
      - ".github/workflows/texture-tests.yml"
      - ".github/release-paths.txt"
  workflow_dispatch:

concurrency:
  group: runtime-release-${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test offline PNG generator
        run: python -m unittest discover -s tests -v
      - name: Dry-run release distribution (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py --version 0.0.0
          (cd dist && sha256sum -c Filamentra-0.0.0.zip.sha256)

      - name: Verify source ZIP using shared contract (PR dry-run)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Filamentra
          version: '0.0.0'
          archives: dist/Filamentra-0.0.0.zip

  changes:
    name: Check runtime changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.impact.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime changes (shared platform)
        id: impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: 4FusionLab/.github/.github/actions/runtime-changes@2e961620a068c3ad754f6e1be05fb6e4ac68e843
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          paths-file: .github/release-paths.txt
          recover-unpublished: 'true'
          token: ${{ github.token }}

  version:
    name: GitVersion 6.8.2
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve GitVersion (shared platform)
        id: gitversion
        uses: 4FusionLab/.github/.github/actions/resolve-version@ad9d60ba4aabc494b4f2c85d6c566a50ca423751

  release:
    name: Publish runtime ZIP
    needs: [unit, version, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: filamentra-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Generate release notes (shared platform)
        uses: 4FusionLab/.github/.github/actions/release-notes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Filamentra
          version: ${{ needs.version.outputs.version }}
          output: ${{ runner.temp }}/release-notes.md
      - name: Build source ZIP
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/build_release.py --version "$VERSION"
          (cd dist && sha256sum -c "Filamentra-$VERSION.zip.sha256")
      - name: Verify source ZIP (shared platform)
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: Filamentra
          version: ${{ needs.version.outputs.version }}
          archives: dist/Filamentra-${{ needs.version.outputs.version }}.zip
          notes: ${{ runner.temp }}/release-notes.md
      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo "Version tag already belongs to another commit: $tag" >&2
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" "dist/Filamentra-$VERSION.zip" "dist/Filamentra-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "Filamentra $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
